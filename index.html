<style>
:root { --bg:#25272f; --fg:#e4e4ea; --dim:#9a9cab; --line:#3a3d4a; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg:#f3f2ef; --fg:#1d1d22; --dim:#6a6a74; --line:#d6d4cf; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; }
main { max-width:1200px; margin:0 auto; padding:20px 16px 48px; }
h1 { font-size:20px; margin:0 0 4px; } h2 { font-size:15px; margin:28px 0 10px; border-bottom:1px solid var(--line); padding-bottom:4px; }
p { color:var(--dim); margin:0; }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:12px; }
button.card { all:unset; cursor:pointer; text-align:center; }
.card img { width:100%; aspect-ratio:4/3; object-fit:cover; object-position:top left; image-rendering:pixelated; border:1px solid var(--line); }
.card span { display:block; font-size:12px; margin-top:4px; } .card small { color:var(--dim); }
#view { position:fixed; inset:0; background:#121318; display:none; flex-direction:column; }
#view.on { display:flex; }
#bar { display:flex; gap:8px; align-items:center; padding:8px 12px; color:#e4e4ea; font-size:13px; }
#bar b { flex:1; } #bar button, #bar a { background:#3a3d4a; color:#e4e4ea; border:0; border-radius:4px; padding:4px 10px; cursor:pointer; text-decoration:none; font:inherit; }
#stage { flex:1; overflow:auto; cursor:grab; } #stage.drag { cursor:grabbing; }
#stage img { image-rendering:pixelated; display:block; margin:0 auto; }

const order = ["Characters","Pokémon","Backgrounds (Routes)","Backgrounds (Locations)","Miscellaneous","More"];
const root = document.getElementById("sections");
for (const sec of order) {
  const items = A.filter(a => a.section === sec); if (!items.length) continue;
  const h = document.createElement("h2"); h.textContent = sec; root.appendChild(h);
  const g = document.createElement("div"); g.className = "grid"; root.appendChild(g);
  for (const a of items) {
    const b = document.createElement("button"); b.className = "card";
    b.innerHTML = `<img src="${a.thumb}" alt=""><span>${a.name}</span>` + (a.sub && a.sub !== "map" ? `<small>${a.sub}</small>` : "");
    b.onclick = () => open(a); g.appendChild(b);
  }
}
const view = document.getElementById("view"), big = document.getElementById("big"), stage = document.getElementById("stage");
let cur = null, z = 1;
function setZoom(n) { z = Math.max(1, Math.min(12, n)); big.style.width = cur.w * z + "px"; document.getElementById("zl").textContent = z + "×"; }
function fit() { const s = Math.floor(Math.min((stage.clientWidth - 16) / cur.w, (stage.clientHeight - 16) / cur.h)); setZoom(Math.max(1, s)); }
function open(a) { cur = a; big.src = a.file; document.getElementById("title").textContent = a.name;
  document.getElementById("orig").href = a.file; view.classList.add("on"); stage.scrollTo(0, 0);
  setZoom(Math.max(2, Math.min(6, Math.floor((stage.clientWidth - 16) / a.w)))); }
document.getElementById("in").onclick = () => setZoom(z + 1);
document.getElementById("out").onclick = () => setZoom(z - 1);
document.getElementById("fit").onclick = fit;
document.getElementById("close").onclick = () => view.classList.remove("on");
document.addEventListener("keydown", e => { if (!view.classList.contains("on")) return;
  if (e.key === "Escape") view.classList.remove("on"); if (e.key === "+" || e.key === "=") setZoom(z + 1); if (e.key === "-") setZoom(z - 1); });
stage.addEventListener("wheel", e => { if (!e.ctrlKey && !e.metaKey && Math.abs(e.deltaY) < 40) return; e.preventDefault(); setZoom(z + (e.deltaY < 0 ? 1 : -1)); }, {passive:false});
let drag = null;
stage.addEventListener("mousedown", e => { drag = [e.clientX, e.clientY, stage.scrollLeft, stage.scrollTop]; stage.classList.add("drag"); });
addEventListener("mouseup", () => { drag = null; stage.classList.remove("drag"); });
addEventListener("mousemove", e => { if (!drag) return; stage.scrollLeft = drag[2] - (e.clientX - drag[0]); stage.scrollTop = drag[3] - (e.clientY - drag[1]); });
</script></body></html>
