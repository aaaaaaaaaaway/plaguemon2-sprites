<style>
:root { --bg:#24262e; --card:#2d3039; --fg:#e6e6ec; --dim:#9b9daa; --line:#3b3e4b; --acc:#d6466a; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg:#f2f1ee; --card:#fff; --fg:#1d1d22; --dim:#6a6a75; --line:#d8d6d1; --acc:#b3264a; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; }
main { max-width:1200px; margin:0 auto; padding:20px 16px 56px; }
header { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; }
h1 { font-size:20px; margin:0; flex:1 1 auto; }
input { flex:0 1 280px; min-width:0; width:100%; padding:7px 10px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); font:inherit; }
nav { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 0; }
nav a { color:var(--dim); text-decoration:none; font-size:12px; border:1px solid var(--line); border-radius:999px; padding:2px 10px; }
nav a:hover { color:var(--fg); }
h2 { font-size:15px; margin:28px 0 10px; padding-bottom:4px; border-bottom:1px solid var(--line); }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:12px; }
.mons { grid-template-columns:repeat(auto-fill, minmax(104px, 1fr)); gap:8px; }
button.card { all:unset; cursor:pointer; text-align:center; border-radius:6px; }
button.card:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
.card img { width:100%; aspect-ratio:4/3; object-fit:cover; image-rendering:pixelated; border:1px solid var(--line); border-radius:4px; background:#343743; }
.mons .card img { aspect-ratio:1; object-fit:contain; background:#fff; padding:4px; }
.card span { display:block; font-size:12px; margin-top:4px; overflow-wrap:anywhere; } .card small { color:var(--dim); font-size:11px; }
.empty { color:var(--dim); }
.ov { position:fixed; inset:0; background:#121318; display:none; flex-direction:column; color:#e6e6ec; z-index:2; }
.ov.on { display:flex; }
.bar { display:flex; gap:8px; align-items:center; padding:8px 12px; font-size:13px; border-bottom:1px solid #2a2c35; }
.bar b { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bar button, .bar a { background:#363946; color:#e6e6ec; border:0; border-radius:4px; padding:4px 10px; cursor:pointer; text-decoration:none; font:inherit; }
.stage { flex:1; overflow:auto; cursor:grab; } .stage.drag { cursor:grabbing; }
#big { image-rendering:pixelated; display:block; margin:0 auto; }
#mon .stage { cursor:default; padding:20px; }
.row { display:flex; flex-wrap:wrap; gap:20px; align-items:flex-end; justify-content:center; margin-bottom:22px; }
.row figure { margin:0; text-align:center; } figcaption { color:#9b9daa; font-size:12px; margin-top:4px; }
.px { image-rendering:pixelated; background:#fff; }
.sw { display:inline-block; width:22px; height:22px; border:1px solid #444; vertical-align:middle; }
.pal { text-align:center; color:#9b9daa; font-size:12px; margin:6px 0; }
.frames { max-width:100%; overflow-x:auto; text-align:center; }
.types { color:#e6e6ec; font-weight:600; letter-spacing:.04em; margin-top:14px; }
.st { margin:8px auto; border-collapse:collapse; font-size:12px; color:#c9cad3; }
.st td { padding:2px 8px; } .st td:nth-child(2) { text-align:right; font-variant-numeric:tabular-nums; }
.sbar { display:inline-block; height:8px; background:#d6466a; border-radius:2px; }

const ORDER = ["Characters","Pokémon","Backgrounds (Routes)","Backgrounds (Locations)","Miscellaneous","More"];
const $ = id => document.getElementById(id), root = $("sections"), q = $("q");
let shown = [], shownMons = [];
function card(img, name, sub, onclick, cls) {
  const b = document.createElement("button"); b.className = "card";
  b.innerHTML = `<img src="${img}" alt="" loading="lazy"><span>${name}</span>` + (sub ? `<small>${sub}</small>` : "");
  b.onclick = onclick; return b;
}
function render() {
  const t = q.value.trim().toLowerCase(); root.innerHTML = ""; $("nav").innerHTML = ""; shown = []; shownMons = [];
  for (const sec of ORDER) {
    const items = SHEETS.filter(a => a.section === sec && (!t || (a.name + " " + (a.sub || "")).toLowerCase().includes(t)));
    const mons = sec === "Pokémon" ? MONS.filter(m => !t || m.label.toLowerCase().includes(t)) : [];
    if (!items.length && !mons.length) continue;
    const id = sec.toLowerCase().replace(/[^a-z]+/g, "-");
    const h = document.createElement("h2"); h.id = id; h.textContent = sec; root.appendChild(h);
    $("nav").insertAdjacentHTML("beforeend", `<a href="#${id}">${sec}</a>`);
    if (items.length) {
      const g = document.createElement("div"); g.className = "grid"; root.appendChild(g);
      for (const a of items) { const i = shown.push(a) - 1; g.appendChild(card(a.thumb, a.name, a.sub && a.sub !== "map" ? a.sub : "", () => openSheet(i))); }
    }
    if (mons.length) {
      const g = document.createElement("div"); g.className = "grid mons"; g.style.marginTop = "14px"; root.appendChild(g);
      for (const m of mons) { const i = shownMons.push(m) - 1; g.appendChild(card(m.front, m.label, "", () => openMon(i))); }
    }
  }
  if (!root.children.length) root.innerHTML = '<p class="empty">Nothing matches.</p>';
}
// sheet viewer: zoom, pan, prev/next
const big = $("big"), stage = $("stage"); let si = -1, z = 1;
function setZoom(n) { const a = shown[si]; z = Math.max(1, Math.min(12, n)); big.style.width = a.w * z + "px"; $("zl").textContent = z + "×"; }
function fit() { const a = shown[si]; setZoom(Math.max(1, Math.floor(Math.min((stage.clientWidth - 16) / a.w, (stage.clientHeight - 16) / a.h)))); }
function openSheet(i) { si = (i + shown.length) % shown.length; const a = shown[si]; big.src = a.file; $("stitle").textContent = a.name + (a.sub && a.sub !== "map" ? " · " + a.sub : "");
  $("orig").href = a.file; $("sheet").classList.add("on"); stage.scrollTo(0, 0); setZoom(Math.max(2, Math.min(6, Math.floor((stage.clientWidth - 16) / a.w))));
  history.replaceState(null, "", "#sheet=" + encodeURIComponent(a.file)); }
$("zin").onclick = () => setZoom(z + 1); $("zout").onclick = () => setZoom(z - 1); $("fit").onclick = fit;
stage.addEventListener("wheel", e => { if (!e.ctrlKey && !e.metaKey && Math.abs(e.deltaY) < 40) return; e.preventDefault(); setZoom(z + (e.deltaY < 0 ? 1 : -1)); }, {passive:false});
let drag = null;
stage.addEventListener("mousedown", e => { drag = [e.clientX, e.clientY, stage.scrollLeft, stage.scrollTop]; stage.classList.add("drag"); });
addEventListener("mouseup", () => { drag = null; stage.classList.remove("drag"); });
addEventListener("mousemove", e => { if (drag) { stage.scrollLeft = drag[2] - (e.clientX - drag[0]); stage.scrollTop = drag[3] - (e.clientY - drag[1]); } });
// monster detail
let mi = -1;
const sw = c => `<span class="sw" style="background:${c}" title="${c}"></span>`;
function openMon(i) { mi = (i + shownMons.length) % shownMons.length; const m = shownMons[mi]; $("mtitle").textContent = m.label;
  const s = m.dims * 8 * 4;

      ${m.gif ? `<figure><img class="px" src="${m.gif}" alt=""><figcaption>animation${m.note ? "<br>" + m.note : ""}</figcaption></figure>` : ""}

function closeAll() { for (const o of document.querySelectorAll(".ov")) o.classList.remove("on"); history.replaceState(null, "", location.pathname); }
for (const b of document.querySelectorAll(".close")) b.onclick = closeAll;
document.addEventListener("keydown", e => {
  const sOn = $("sheet").classList.contains("on"), mOn = $("mon").classList.contains("on");

  if (sOn && e.key === "-") setZoom(z - 1);
});

const h = decodeURIComponent(location.hash.slice(1));
